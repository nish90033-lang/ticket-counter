databases:
  - name: ticket-db
    databaseName: ticket_db
    user: ticket_user
    plan: free

services:
  # ── Django Web ────────────────────────────────────────────────
  - type: web
    name: ticket-web
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ticket-redis
          type: redis
          property: connectionString
      - key: SEAT_LOCK_TIMEOUT
        value: 300
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://ticket-frontend.onrender.com

  # ── Celery Worker ─────────────────────────────────────────────
  - type: worker
    name: ticket-celery
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker --loglevel=info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ticket-redis
          type: redis
          property: connectionString

  # ── Celery Beat ───────────────────────────────────────────────
  - type: worker
    name: ticket-celery-beat
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ticket-redis
          type: redis
          property: connectionString

  # ── Redis ─────────────────────────────────────────────────────
  - type: redis
    name: ticket-redis
    plan: free
    ipAllowList: []

  # ── React Frontend ────────────────────────────────────────────
  - type: web
    name: ticket-frontend
    plan: free
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://ticket-web.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html